services:
  - type: web
    name: takeoff-backend
    rootDir: backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && pip install gunicorn==23.0.0
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: takeoff-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: takeoff-redis
          property: connectionString
      - key: ALLOWED_HOSTS
        value: "african-unicorn.onrender.com,takeoff-backend.onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://takeoff-frontend.vercel.app,http://localhost:5173,http://localhost:3000"
      - key: OTP_PROVIDER
        value: console
      - key: MEDIA_STORAGE_PROVIDER
        value: local
      - key: PYTHON_VERSION
        value: "3.12.0"

  - type: redis
    name: takeoff-redis
    plan: free
    ipAllowList: []

databases:
  - name: takeoff-db
    databaseName: takeoff_db
    user: takeoff_user
    plan: free
